# The part of the reload test that differs per module.  ci/reload.sh sources
# this with $WORK and $PORT already set and then drives the reloads.
#
#     RELOAD_HTTP    directives for the http block, may be empty
#     RELOAD_SERVER  directives for the server block
#     RELOAD_EXPECT  what reload_probe has to print
#     reload_probe   prints what the server answered

RELOAD_HTTP="
    slowfs_cache_path $WORK/cache levels=1:2 keys_zone=reload:4m inactive=1h;"

RELOAD_SERVER="
        location /probe {
            root $WORK/origin;

            slowfs_cache       reload;
            slowfs_cache_key   \$uri;
            slowfs_cache_valid 1h;
        }"

RELOAD_EXPECT='through the slow filesystem'

# The file is served through the cache, so the answer only arrives when the
# module's shared zone and its cache are still the ones this cycle set up.
mkdir -p "$WORK/origin/probe"
echo 'through the slow filesystem' > "$WORK/origin/probe/file.txt"

reload_probe() {
	curl -s --max-time 5 "http://127.0.0.1:$PORT/probe/file.txt"
}
